name: "🛡️ Blindagem de Licença e Qualidade Sambox"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'modules/**'
      - 'sambox'

jobs:
  auditoria:
    name: "🔍 Varredura e Qualidade"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Clonando o Pull Request"
        uses: actions/checkout@v4

      - name: "🕵️‍♂️ Varredura Cirúrgica Anti-Copyleft"
        run: |
          printf "\033[36m[SAMBOX SECURITY]:\033[0m Iniciando varredura analítica nos arquivos enviados...\n"
          
          # Executa o grep recursivo ignorando maiúsculas nas palavras-chave da GPL
          if grep -r -i -E "GPL|General Public|LGPL|AGPL|GFDL|GNU|Common|Mozzila|Copyleft|MPL|CDDL" modules/; then
              printf "\n\033[31m[ERRO CRÍTICO]: Tentativa de contágio viral detectada!\033[0m\n"
              printf "Módulos sob licenças restritivas não são aceitos no ecossistema Sambox.\n"
              printf "O Sambox aceita apenas BSD, MIT, Apache, Zlib, CC0 e WTFPL.\n"
              printf "Amadorismo jurídico e burocracia ideológica aqui não se criam!\n\n"
              exit 1
          fi
          
          printf "\n\033[32m[SUCESSO]: Módulo validado com licença livre e sem frescura.\033[0m\n"

      - name: "🛠️ Auditoria de Performance e Sintaxe (ShellCheck)"
        run: |
          printf "\033[36m[SAMBOX QUALITY]:\033[0m Invocando ShellCheck para garantir performance bruta e Bash puro...\n"
          
          # Instala o utilitário externo isolado na máquina temporária do GitHub
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          
          # Roda a análise nos módulos e no orquestrador principal
          # O parâmetro -e ignora avisos bobos se você quiser (ex: SC1090 para fontes dinâmicos)
          if ! shellcheck -x modules/*.sh sambox; then
              printf "\n\033[31m[ERRO TÉCNICO]: Código Bash fora dos padrões de performance ou com riscos de quebra!\033[0m\n"
              printf "Revise os avisos do ShellCheck acima antes de forçar o merge no Sambox.\n\n"
              exit 1
          fi
          
          printf "\n\033[32m[SUCESSO]: Sintaxe impecável e pronta para rodar em qualquer batata eletrônica!\033[0m\n"
